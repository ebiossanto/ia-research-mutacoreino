[workspace]
resolver = "2"
members = [
    "src/rust/origo-overlay",
]
exclude = []

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ebiossanto/ia-research-mutacoreino"
authors = ["Euzébio Soares <ebiossanto@github.com>"]
description = "MutaCore - Reino Digital: Ecossistema Cognitivo Concorrente e Mutável"

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
ring = "0.17"
sha2 = "0.10"
rand = "0.8"
zeroize = "1.6"

# Serialization
bincode = "1.3"
postcard = "1.0"

# Math/Linear Algebra
nalgebra = "0.32"
sprs = "0.14"

# Testing
proptest = "1.0"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
debug = true

[profile.test]
opt-level = 2
debug = true