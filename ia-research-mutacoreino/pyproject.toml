[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mutacore-simulations"
version = "0.3.0"
description = "MutaCore Thermodynamic, Topological, and Cryptographic Simulations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Euzébio Soares", email = "ebiossanto@github.com"}
]
maintainers = [
    {name = "Euzébio Soares", email = "ebiossanto@github.com"}
]
keywords = [
    "mutacore",
    "thermodynamics",
    "landauer",
    "hodge",
    "hypercube",
    "spectrum1024",
    "agi",
    "distributed-systems"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "sympy>=1.12.0",
    "cryptography>=42.0.0",
    "pycryptodome>=3.19.0",
    "msgpack>=1.0.7",
    "orjson>=3.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "rich>=13.7.0",
    "asyncio>=3.4.3",
    "aiohttp>=3.9.0",
    "numba>=0.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.92.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pre-commit>=3.5.0",
    "types-requests>=2.31.0",
    "memory-profiler>=0.61.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.27.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/ebiossanto/ia-research-mutacoreino"
Repository = "https://github.com/ebiossanto/ia-research-mutacoreino"
Issues = "https://github.com/ebiossanto/ia-research-mutacoreino/issues"
Documentation = "https://ebiossanto.github.io/ia-research-mutacoreino/"

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["mutacore*"]

[tool.setuptools.package-dir]
"" = "src/python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=mutacore --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "property: marks tests as property-based",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE"]
ignore = ["E501", "SIM102"]
per-file-ignores = {
    "tests/*": ["S101", "S106"],
    "src/python/spectrum1024_tests.py": ["S311"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.coverage.run]
source = ["src/python/mutacore"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hypothesis]
database = ".hypothesis"
verbosity = "verbose"
phases = ["explicit", "reuse", "generate", "shrink"]
max_examples = 1000
deadline = 5000

[tool.sphinx]
source_dir = "docs"
build_dir = "docs/_build"